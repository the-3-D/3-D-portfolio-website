<!doctype html>
<html lang="en">
<head>
  <!-- META -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TITLE -->
  <title>3D | Contact</title>

  <!-- STYLES -->
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CONFIG -->
  <script src="config.js"></script>

  <!-- COMPONENTS -->
  <script src="components.js" defer></script>

  <!-- PAGE LOGIC -->
  <script src="Script.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <main-header></main-header>

  <!-- CONTACT HERO / FORM -->
  <section class="contact fade-in">
    <div class="container">

      <h1>Get in Touch</h1>
      <p>
        I'd love to hear from you! Whether you have a project idea,
        a question, or just want to say hello.
      </p>

      <!-- FORM -->
      <form class="contact-form" id="contactForm">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Your name" required>
        </div>

      <div class="form-group">
    <label for="email">Email Address</label>
    <input class="email-input" type="email" id="email" placeholder="email@gmail.com" required>
    
    <!-- This is where your message will appear -->
    <p id="demo"></p> 
</div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your message..." required></textarea>
        </div>

        <button type="submit" id="btn-send">Send Message</button>

      </form>
    </div>
  </section>

  <!-- CONTACT INFO -->
  <section class="contact-info">
    <div class="container">
      <h2>Contact Information</h2>

      <ul>
        <li>
          Email:
          <a href="mailto:youremail@example.com">youremail@example.com</a>
        </li>
        <li>Location: Jimma, Ethiopia</li>
        <li>
          Connect:
          <a href="#">LinkedIn</a> |
          <a href="#">Telegram</a> |
          <a href="#">YouTube</a>
        </li>
      </ul>
    </div>
  </section>

  <!-- FOOTER -->
  <main-footer></main-footer>

</body>
</html>
