<!doctype html>
<html lang="en">
<head>
  <!-- META -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TITLE -->
  <title>3D | Projects</title>

  <!-- STYLES -->
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CONFIG (optional runtime settings) -->
  <script src="config.js"></script>

  <!-- COMPONENTS -->
  <script src="components.js" defer></script>

  <!-- PAGE LOGIC -->
  <script src="Script.js" defer></script>
</head>

<body>

  <!-- ===== HEADER COMPONENT ===== -->
  <main-header></main-header>

  <!-- ===== HERO SECTION ===== -->
  <section class="projects-hero">
    <div class="container">
      <h1>Our Projects</h1>
      <p>
        Discover how our team transforms bold ideas into real-world solutions —
        blending creativity, code, and collaboration.
      </p>
    </div>
  </section>
  <!-- ===== PROJECTS (DATA-DRIVEN) ===== -->
  <section class="projects-gallery">
    <div class="container">
      <!-- 🔥 JS WILL INJECT PROJECT CARDS HERE -->
      <div id="projectsContainer"></div>
    </div>
  </section>

  <!-- ===== CONTACT (COMPONENT SLOT) ===== -->
  <section id="contactSection" class="contact-link fade-in"></section>

  <!-- ===== FOOTER COMPONENT ===== -->
  <main-footer></main-footer>

</body>
</html>
